services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_DB: queryimmune
      POSTGRES_USER: queryimmune_bootstrap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - queryimmune_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryimmune_bootstrap -d queryimmune"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  queryimmune_pgdata:
